spring.datasource.url=jdbc:h2:mem:orders;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.docker.compose.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-test.yaml

app.receipts.worker-enabled=false
spring.rabbitmq.listener.simple.auto-startup=false

app.email.worker-enabled=false

spring.kafka.admin.auto-create=false
