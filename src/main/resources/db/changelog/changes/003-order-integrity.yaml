databaseChangeLog:
  - changeSet:
      id: 003-order-integrity
      author: pedidos360
      changes:
        - modifyDataType:
            tableName: orders
            columnName: total_amount
            newDataType: DECIMAL(19,2)
        - modifyDataType:
            tableName: order_item
            columnName: unit_price
            newDataType: DECIMAL(19,2)
        - addColumn:
            tableName: orders
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: owner_subject
                  type: VARCHAR(512)
              - column:
                  name: owner_issuer
                  type: VARCHAR(512)
        - createIndex:
            tableName: orders
            indexName: idx_orders_owner
            columns:
              - column:
                  name: owner_issuer
              - column:
                  name: owner_subject
