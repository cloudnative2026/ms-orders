spring.application.name=ms-orders
server.port=${SERVER_PORT:8081}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/orders_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.docker.compose.enabled=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER:https://login.microsoftonline.com/f9bce5c0-eb96-4341-aad7-411ae980b12a/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${ENTRA_AUDIENCE:c1e3acd7-4501-432e-a446-71ab2dca8ac3}
catalog.service.url=${MS_CATALOG:http://localhost:8080}

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:admin123}
app.rabbitmq.exchange=${APP_RABBITMQ_EXCHANGE:notifications.exchange}
app.rabbitmq.routing-key=${APP_RABBITMQ_ROUTINGKEY:notifications.routingkey}

# Bound retries; failed deliveries go to receipts.queue.dlq. Pending jobs remain durable.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Local development defaults: Mailpit captures mail and does not forward it.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
app.email.from=${MAIL_FROM:pedidos360@example.test}
